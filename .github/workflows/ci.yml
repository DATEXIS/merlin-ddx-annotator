name: CI

# Runs on synthetic data only. No secrets, no external services, no restricted data.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --locked --extra analysis --extra dev
          npm ci

      - name: Python tests (backend, rubric, original analyses, reproduction, DDx)
        run: uv run pytest

      - name: Synthetic examples are up to date
        run: |
          uv run python scripts/build_synthetic_demo.py --check
          uv run python scripts/build_synthetic_ddx_demo.py --check
          uv run python scripts/demo_summary.py --check

      - name: Published agreement statistics reproduce from the contingency matrices
        run: |
          uv run python scripts/kappa_from_contingency.py
          uv run python scripts/ddx_kappa_from_contingency.py

      - name: Original DDx analysis runs on the synthetic cases
        run: |
          uv run python scripts/make_synthetic_ddx_fixture.py --out .demo/ddx_fixture
          uv run python scripts/run_ddx_analysis.py study --fixture .demo/ddx_fixture --out .demo/ddx_study --quiet
          uv run python scripts/run_ddx_analysis.py pilot --fixture .demo/ddx_fixture --out .demo/ddx_pilot --quiet

      - name: Frontend unit tests
        run: npx vitest run

      - name: Type-check and build
        run: npm run build

      - name: End-to-end test on the demo server
        run: |
          npx playwright install --with-deps chromium
          PYTHON=.venv/bin/python npx playwright test
